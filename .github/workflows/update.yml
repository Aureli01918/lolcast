name: Refresh forecasts

on:
  schedule:
    # 06:00 UTC daily. Oracle's Elixir updates overnight, so this picks up
    # yesterday's results before most of the day's matches start.
    - cron: "0 6 * * *"
  workflow_dispatch:      # the Update button, and the Actions tab
  push:
    branches: [main]
    paths:
      - "config.yaml"     # re-run when you change settings or features
      - "lolcast/**"

# contents: write is needed to commit the ledger back. Without it the
# record of what was forecast would be wiped on every run, and nothing
# could ever be graded.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lolcast-refresh
  cancel-in-progress: false   # never kill a run mid-ledger-write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Leaguepedia limits anonymous callers per IP address, and CI runners
      # share addresses. Logging in moves the limit onto your account.
      # Create these under Settings -> Secrets and variables -> Actions.
      # This step reports whether they arrived, without revealing them:
      # it prints lengths only, never the values.
      - name: Check wiki credentials
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: |
          ok=1
          if [ -z "$WIKI_USERNAME" ]; then
            echo "WIKI_USERNAME: MISSING"; ok=0
          else
            echo "WIKI_USERNAME: present, ${#WIKI_USERNAME} characters"
            case "$WIKI_USERNAME" in
              *@*) echo "  contains '@' - correct format" ;;
              *)   echo "  ::warning::no '@' found. Bot passwords need the"
                   echo "  ::warning::full Name@label form, e.g. Marco@lolcast" ;;
            esac
          fi
          if [ -z "$WIKI_PASSWORD" ]; then
            echo "WIKI_PASSWORD: MISSING"; ok=0
          else
            echo "WIKI_PASSWORD: present, ${#WIKI_PASSWORD} characters"
          fi
          if [ "$ok" = "0" ]; then
            echo "::error::Credentials did not reach the job. Check they are"
            echo "::error::Repository secrets (not Variables, not Environment"
            echo "::error::secrets) and named exactly WIKI_USERNAME and"
            echo "::error::WIKI_PASSWORD. Secrets added mid-run do not apply"
            echo "::error::to that run."
          fi


      # Only the current year's CSV changes; cache the rest.
      # First run only. Builds data/history.csv from Leaguepedia, which
      # rate-limits anonymous callers to about one request a minute, so
      # this takes the better part of an hour. It is then committed and
      # never runs again.
      - name: Build history (first run only)
        if: hashFiles('data/history.csv') == ''
        timeout-minutes: 300
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: python -m lolcast bootstrap

      - name: Check we have history
        run: |
          if [ ! -s data/history.csv ]; then
            echo "::error::data/history.csv is missing or empty. Re-run this"
            echo "::error::workflow; the bootstrap step rebuilds it."
            exit 1
          fi
          wc -l data/history.csv

      # Grade first: today's forecast should benefit from yesterday's
      # results, both in the ratings and in the self-calibration.
      - name: Grade finished matches
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: python -m lolcast grade
        continue-on-error: true    # a source outage must not block the build

      - name: Build forecasts
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: python -m lolcast predict

      - name: Show scores in the run log
        run: |
          python -m lolcast scoreboard
          python -m lolcast backtest --by-league
        continue-on-error: true

      # If the repository changes while a run is in flight -- editing a
      # file in the web UI is enough -- the push is rejected. Rebasing a
      # CSV of appended rows invites conflicts for no benefit, and only
      # this workflow writes these files, so on a clash our copy is simply
      # the right one. Rebuild the commit on top of whatever is there now.
      - name: Commit data
        run: |
          git config user.name  "lolcast bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A hard reset would also revert the freshly built dashboard, so
          # everything this run produced is set aside first.
          mkdir -p /tmp/lolcast-keep/data /tmp/lolcast-keep/docs
          cp -f data/ledger.csv  /tmp/lolcast-keep/data/ 2>/dev/null || true
          cp -f data/history.csv /tmp/lolcast-keep/data/ 2>/dev/null || true
          cp -f docs/data.json   /tmp/lolcast-keep/docs/ 2>/dev/null || true

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp -f /tmp/lolcast-keep/data/*.csv data/  2>/dev/null || true
            cp -f /tmp/lolcast-keep/docs/*.json docs/ 2>/dev/null || true

            git add data/ledger.csv data/history.csv 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No data changes to commit."
              pushed=1
              break
            fi
            git commit -m "Data: forecasts, results and history for $(date -u +%Y-%m-%d)"
            if git push; then
              echo "Pushed on attempt $attempt."
              pushed=1
              break
            fi
            echo "Push rejected on attempt $attempt; the repository moved. Retrying."
            sleep 10
          done

          if [ "$pushed" != "1" ]; then
            echo "::warning::Could not push the ledger after 3 attempts."
            echo "::warning::The dashboard will still deploy. Forecasts from"
            echo "::warning::this run were not recorded; the next run will"
            echo "::warning::snapshot them again."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
